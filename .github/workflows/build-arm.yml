name: Build ARM release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -q *.zip

      - name: Build, test and package
        run: sh VelvetChords-source/scripts/build-arm.sh

      - name: Checksum
        run: cd VelvetChords-source/dist && sha256sum VelvetChords-*.zip | tee SHA256SUM.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-arm
          path: |
            VelvetChords-source/dist/VelvetChords-*.zip
            VelvetChords-source/dist/SHA256SUM.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" VelvetChords-source/dist/VelvetChords-*.zip VelvetChords-source/dist/SHA256SUM.txt --generate-notes
