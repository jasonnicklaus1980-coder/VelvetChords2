name: Build ARM release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -q *.zip

      - name: Build, test and package
        run: |
          cd VelvetChords-source
          docker run --rm -v "$PWD":/src -w /src debian:bullseye sh -c '
            echo "deb http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list &&
            echo "deb http://archive.debian.org/debian-security bullseye-security main" >> /etc/apt/sources.list &&
            apt-get -o Acquire::Check-Valid-Until=false update -qq &&
            apt-get install -y -qq gcc gcc-arm-linux-gnueabihf libc6-dev-armhf-cross binutils-arm-linux-gnueabihf make python3 zip qemu-user >/dev/null &&
            make clean && make test && make arm-test && make release'
          sudo chown -R "$USER" .

      - name: Checksum
        run: cd VelvetChords-source/dist && sha256sum VelvetChords-*.zip | tee SHA256SUM.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-arm
          path: |
            VelvetChords-source/dist/VelvetChords-*.zip
            VelvetChords-source/dist/SHA256SUM.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" VelvetChords-source/dist/VelvetChords-*.zip VelvetChords-source/dist/SHA256SUM.txt --generate-notes
